# Entorno MÍNIMO: alcanza para las semanas 1 a 6 (Jupyter, pandas, gráficos básicos).
# Es liviano a propósito, para instalarlo rápido en el laboratorio el primer día.
# Antes de la semana 7 se actualiza con: conda env update -f environment-completo.yml
name: seminario-encuestas
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pandas>=2.2
  - numpy
  - matplotlib
  - seaborn
  - jupyterlab
  - ipykernel
  - nbformat
  - nbclient
